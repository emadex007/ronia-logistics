<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b2545;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:22px;margin:18px 0 6px}
  p{opacity:.8;margin:0 0 22px;line-height:1.5}
  button{background:#f97316;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:16px;font-weight:600}
</style>
</head>
<body>
  <div>
    <img src="/icon-192.png" alt="">
    <h1>No internet connection</h1>
    <p>Check your data or Wi-Fi, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
